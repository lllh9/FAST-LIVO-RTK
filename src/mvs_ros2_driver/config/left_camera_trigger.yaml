%YAML:1.0

#--------------------------------------------------------------------------------------------
# Camera Parameters 当前
#--------------------------------------------------------------------------------------------
SerialNumber: "DB0275877" 
TopicName: "left_camera/image"
FrameId: "left_camera_optical_frame"

TriggerEnable: 1 # 0 stands for Off, 1 stands for On
TimestampWaitTimeoutMs: 300 # 等待下一帧雷达共享时间戳的最长时间；10Hz雷达建议300ms以容忍系统抖动。
TimestampRemapAfterTimeouts: 3 # 连续超时达到该次数后重新映射共享文件，恢复雷达驱动重启或文件被替换的情况。

ExposureAutoMode: 0 # 0 stands for Off, 1 stands for Once, 2 stands for Continues
ExposureTime: 8000 # us

# ExposureAutoMode: 2
# AutoExposureTimeLower: 100
# AutoExposureTimeUpper: 20000

image_scale: 1 # 1 0.5
GainAuto: 0 # Gain Auto, 0 stands for Off, 1 stands for Once, 2 stands for Continues
Gain: 15 # min: 0   max: 17.0166
Gamma: 0.7  # min: 0   max: 17.0166
GammaSelector: 1 # 0 stands for user, 1 stands for sRGB
# GammaEnable: 1

PixelFormat: 4 # 0: RGB8, 1: BayerRG8, 2: BayerRG12Packed, 3: BayerGB12Packed, 4: BayerGB8


#------------------------------------------
# Camera intrinsic calibration
#------------------------------------------
Width: 1280
Height: 1024
DistortionModel: "plumb_bob"  #相机使用的是针孔相机模型的标准棕榈-布朗畸变模型

